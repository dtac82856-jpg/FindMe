<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FindMe | ค้นหาความถนัดของคุณ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">Find<span>Me</span></div>
        <nav>
            <a href="#">หน้าแรก</a>
            <a href="#">เกี่ยวกับ</a>
        </nav>
    </header>

    <main class="hero">

        <div class="hero-text">
            <p class="small-title">DISCOVER YOUR POTENTIAL</p>

            <h1>
                ค้นพบว่า<br>
                <span>คุณถนัดอะไร?</span>
            </h1>

            <p class="description">
                แบบประเมินสั้น ๆ ที่ช่วยวิเคราะห์ความสนใจ
                ความถนัด และแนะนำแนวทางคณะที่อาจเหมาะกับคุณ
            </p>

            <button onclick="startTest()">
                เริ่มค้นหาความถนัด →
            </button>
        </div>

        <div class="hero-card">
            <div class="circle">✦</div>
            <h2>ค้นหาตัวตนของคุณ</h2>
            <p>ตอบคำถามเพียงไม่กี่ข้อ<br>แล้วดูผลลัพธ์ของคุณ</p>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
